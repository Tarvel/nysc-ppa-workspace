<header class="bg-paper border-b border-border sticky top-0 z-30">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-14 sm:h-16 flex items-center justify-between">
    <!-- Brand Title -->
    <div class="flex items-center gap-3">
      <a href="{% url 'core:dashboard' %}" class="flex items-center gap-2 group">
        <div class="w-8 h-8 rounded bg-burgundy-700 text-white flex items-center justify-center font-serif text-lg font-bold shadow-sm group-hover:bg-burgundy-800 transition">
          T
        </div>
        <div>
          <span class="font-serif font-bold text-lg text-ink-900 leading-none block">Tai's PPA Desk</span>
          <span class="text-[10px] font-mono text-ink-400 uppercase tracking-wider block">NYSC Research Workspace</span>
        </div>
      </a>
    </div>

    <!-- Global Search & Nav Links (Desktop) -->
    <div class="hidden md:flex items-center gap-6">
      <nav class="flex items-center gap-4 text-sm font-medium text-ink-500">
        <a href="{% url 'core:dashboard' %}" class="hover:text-burgundy-700 py-1 transition {% if request.resolver_match.url_name == 'dashboard' %}text-burgundy-700 font-semibold{% endif %}">
          Today
        </a>
        <a href="{% url 'organizations:list' %}" class="hover:text-burgundy-700 py-1 transition {% if 'organizations' in request.path %}text-burgundy-700 font-semibold{% endif %}">
          Organizations
        </a>
        <a href="{% url 'outreach:list' %}" class="hover:text-burgundy-700 py-1 transition {% if 'outreach' in request.path %}text-burgundy-700 font-semibold{% endif %}">
          Outreach
        </a>
        <a href="{% url 'accounts:profile' %}" class="hover:text-burgundy-700 py-1 transition {% if 'profile' in request.path %}text-burgundy-700 font-semibold{% endif %}">
          Profile
        </a>
      </nav>

      <!-- Global Search Trigger / Command Palette Trigger -->
      <button @click="commandPaletteOpen = true" class="flex items-center gap-2 bg-desk hover:bg-border px-3 py-1.5 rounded border border-border text-xs text-ink-500 transition">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <span>Search workspace...</span>
        <kbd class="font-mono bg-paper border border-border px-1.5 py-0.5 text-[10px] rounded text-ink-400">⌘K</kbd>
      </button>

      <!-- Quick Capture Button -->
      <button @click="quickAddOpen = true" class="btn bg-burgundy-700 hover:bg-burgundy-800 text-white text-xs font-medium px-3.5 py-1.5 rounded shadow-sm flex items-center gap-1.5">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        <span>+ Add Org</span>
      </button>
    </div>

    <!-- Mobile Header Actions -->
    <div class="flex md:hidden items-center gap-2">
      <button @click="commandPaletteOpen = true" class="p-2 rounded text-ink-500 hover:bg-desk">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      </button>
      <button @click="quickAddOpen = true" class="btn bg-burgundy-700 text-white p-2 rounded shadow-sm">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
      </button>
    </div>
  </div>
</header>
