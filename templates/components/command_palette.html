<div x-show="commandPaletteOpen"
     x-transition:enter="ease-out duration-200"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="ease-in duration-150"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0"
     class="fixed inset-0 z-50 overflow-y-auto p-4 sm:p-6 md:p-20 bg-ink-900/60 backdrop-blur-sm flex justify-center items-start"
     style="display: none;"
     @click.self="commandPaletteOpen = false">

  <div class="bg-paper border border-border w-full max-w-xl rounded-xl shadow-2xl overflow-hidden flex flex-col mt-4 sm:mt-12">
    <!-- Search Bar -->
    <form action="{% url 'core:search' %}" method="GET" class="flex items-center px-4 py-3 border-b border-border bg-white">
      <svg class="w-5 h-5 text-ink-400 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      <input type="text"
             name="q"
             placeholder="Search organizations, contacts, evidence, notes..."
             class="w-full bg-transparent text-ink-900 text-sm focus:outline-none placeholder-ink-400 font-sans"
             x-ref="searchInput"
             autofocus>
      <button type="button" @click="commandPaletteOpen = false" class="text-xs font-mono text-ink-400 hover:text-ink-700 bg-desk px-2 py-1 rounded">ESC</button>
    </form>

    <!-- Quick Shortcuts & Actions -->
    <div class="p-4 bg-desk text-xs font-mono text-ink-500 flex flex-col gap-2">
      <div class="font-bold uppercase tracking-wider text-[10px] text-ink-400">Quick Actions</div>
      <a href="#" @click.prevent="commandPaletteOpen = false; quickAddOpen = true" class="flex items-center justify-between p-2 rounded bg-paper hover:bg-white border border-border transition text-ink-900">
        <span class="flex items-center gap-2">
          <svg class="w-4 h-4 text-burgundy-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          + Add New Organization
        </span>
        <span class="text-[10px] text-ink-400">Quick Capture</span>
      </a>
      <a href="{% url 'core:dashboard' %}" @click="commandPaletteOpen = false" class="flex items-center justify-between p-2 rounded bg-paper hover:bg-white border border-border transition text-ink-900">
        <span>Go to Today Dashboard</span>
        <span class="text-[10px] text-ink-400">View Action Queue</span>
      </a>
      <a href="{% url 'organizations:list' %}" @click="commandPaletteOpen = false" class="flex items-center justify-between p-2 rounded bg-paper hover:bg-white border border-border transition text-ink-900">
        <span>View All Organizations</span>
        <span class="text-[10px] text-ink-400">Filter & Research</span>
      </a>
    </div>
  </div>
</div>
